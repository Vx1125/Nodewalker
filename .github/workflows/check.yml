name: Check Lua

# Syntax-checks every .lua file (including subfolders) on each push and pull request.
# Syntax only: it can't catch wrong game function names or runtime errors.
on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Lua syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          rc=0; while IFS= read -r -d '' f; do luac5.1 -p "$f" || rc=1; done < <(find . -name '*.lua' -not -path './.git/*' -print0); exit $rc
